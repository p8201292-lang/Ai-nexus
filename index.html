
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Nexus | Login & Sign Up</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --primary: #7855ef;
      --secondary: #328ce9;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(
        135deg, #100b2e, #29206a, #1765a0
      );
      color: white;
      transition: 0.3s ease;
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 30px 25px;
      border-radius: 22px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 15px 45px rgba(0,0,0,0.3);
      backdrop-filter: blur(15px);
    }

    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 15px;
    }

    .logo {
      font-size: 31px;
      font-weight: bold;
      color: #c2b7ff;
      letter-spacing: 1px;
    }

    .tagline {
      text-align: center;
      font-size: 13px;
      color: #d3d8ff;
      margin-bottom: 20px;
    }

    .theme-toggle {
      padding: 9px 16px;
      border-radius: 20px;
      border: 1px solid #a69aff;
      background: transparent;
      color: white;
      cursor: pointer;
      font-size: 12px;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 1px solid #8c83e8;
      border-radius: 9px;
      background: transparent;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .tabs button.active {
      background: linear-gradient(
        90deg, var(--primary), var(--secondary)
      );
      border-color: transparent;
    }

    h2 {
      text-align: center;
      margin-bottom: 9px;
    }

    .subtitle {
      text-align: center;
      color: #d0d4ee;
      font-size: 13px;
      margin-bottom: 23px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 9px;
      background: rgba(255,255,255,0.1);
      color: white;
      outline: none;
      font-size: 14px;
    }

    input::placeholder {
      color: #c3c4d9;
    }

    input:focus {
      border-color: #a69aff;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .show-btn {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #c7c5ff;
      cursor: pointer;
      font-size: 12px;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      margin-top: 7px;
      border: none;
      border-radius: 9px;
      background: linear-gradient(
        90deg, var(--primary), var(--secondary)
      );
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .main-btn:hover {
      opacity: 0.9;
    }

    .switch {
      text-align: center;
      margin-top: 20px;
      color: #d4d7ed;
      font-size: 13px;
    }

    .switch a {
      color: #bdb4ff;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 22px;
      text-align: center;
      color: #b9c4e8;
      font-size: 11px;
      line-height: 1.6;
    }

    .hidden {
      display: none;
    }

    /* LIGHT THEME */

    body.light {
      background: linear-gradient(
        135deg, #edf0ff, #e4eaff, #d8f1ff
      );
      color: #202044;
    }

    body.light .container {
      background: rgba(255,255,255,0.85);
      border-color: #d5d9f5;
      box-shadow: 0 15px 40px rgba(50,50,100,0.12);
    }

    body.light .logo {
      color: #5541bb;
    }

    body.light .tagline,
    body.light .subtitle,
    body.light .switch,
    body.light .note {
      color: #555b7a;
    }

    body.light label {
      color: #29294f;
    }

    body.light input {
      background: white;
      color: #222244;
      border-color: #c7cbea;
    }

    body.light input::placeholder {
      color: #8588a2;
    }

    body.light .show-btn {
      color: #5541bb;
    }

    body.light .theme-toggle {
      color: #5541bb;
      border-color: #8c83e8;
    }

    body.light .tabs button:not(.active) {
      color: #5541bb;
      border-color: #8c83e8;
    }

    body.light .switch a {
      color: #5541bb;
    }

    @media (max-width: 400px) {
      .container {
        padding: 25px 18px;
      }

      .logo {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- BRANDING -->

    <div class="top-bar">
      <div class="logo">✦ AI NEXUS</div>

      <button
        class="theme-toggle"
        id="themeToggle"
        type="button"
        onclick="toggleTheme()">
        ☀️ Light Mode
      </button>
    </div>

    <p class="tagline">
      Your Gateway to Artificial Intelligence
    </p>

    <!-- LOGIN AND SIGNUP TABS -->

    <div class="tabs">

      <button
        id="loginTab"
        class="active"
        onclick="showPage('login')">
        Login
      </button>

      <button
        id="signupTab"
        onclick="showPage('signup')">
        Sign Up
      </button>

    </div>

    <!-- LOGIN FORM -->

    <form id="loginForm" onsubmit="loginUser(event)">

      <h2>Welcome Back!</h2>

      <p class="subtitle">
        Login to explore the world of AI.
      </p>

      <div class="field">
        <label>Email Address</label>

        <input
          type="email"
          id="loginEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required>
      </div>

      <div class="field">

        <label>Password</label>

        <div class="password-wrap">

          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword('loginPassword', this)">
            Show
          </button>

        </div>
      </div>

      <button type="submit" class="main-btn">
        Login to AI Nexus
      </button>

      <p class="switch">
        New to AI Nexus?

        <a onclick="showPage('signup')">
          Create Account
        </a>
      </p>

    </form>

    <!-- SIGNUP FORM -->

    <form
      id="signupForm"
      class="hidden"
      onsubmit="registerUser(event)">

      <h2>Create Your Account</h2>

      <p class="subtitle">
        Join the AI Nexus community.
      </p>

      <div class="field">

        <label>Full Name</label>

        <input
          type="text"
          id="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required>

      </div>

      <div class="field">

        <label>Email Address</label>

        <input
          type="email"
          id="signupEmail"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>

      <div class="field">

        <label>Create Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="8"
            autocomplete="new-password"
            required>

          <button
            type="button"
            class="show-btn"
            onclick="togglePassword('signupPassword', this)">
            Show
          </button>

        </div>
      </div>

      <div class="field">

        <label>Confirm Password</label>

        <input
          type="password"
          id="confirmPassword"
          placeholder="Confirm your password"
          minlength="8"
          autocomplete="new-password"
          required>

      </div>

      <button type="submit" class="main-btn">
        Create My Account
      </button>

      <p class="switch">
        Already have an account?

        <a onclick="showPage('login')">
          Login
        </a>
      </p>

    </form>

    <!-- FOOTER -->

    <p class="note">
      AI NEXUS · Explore. Learn. Innovate.<br>
      Your journey into AI starts here.
    </p>

  </div>

  <script>

    // SWITCH BETWEEN LOGIN AND SIGNUP

    function showPage(page) {

      const login = page === "login";

      document.getElementById("loginForm")
        .classList.toggle("hidden", !login);

      document.getElementById("signupForm")
        .classList.toggle("hidden", login);

      document.getElementById("loginTab")
        .classList.toggle("active", login);

      document.getElementById("signupTab")
        .classList.toggle("active", !login);

    }

    // SHOW AND HIDE PASSWORD

    function togglePassword(id, button) {

      const field = document.getElementById(id);

      if (field.type === "password") {
        field.type = "text";
        button.textContent = "Hide";
      } else {
        field.type = "password";
        button.textContent = "Show";
      }

    }

    // LIGHT AND DARK MODE

    function applyTheme(theme) {

      document.body.classList.toggle(
        "light", theme === "light"
      );

      document.getElementById("themeToggle")
        .textContent =
        theme === "light"
          ? "🌙 Dark Mode"
          : "☀️ Light Mode";

      localStorage.setItem("aiNexusTheme", theme);

    }

    function toggleTheme() {

      const isLight =
        document.body.classList.contains("light");

      applyTheme(isLight ? "dark" : "light");

    }

    // LOAD SAVED THEME

    applyTheme(
      localStorage.getItem("aiNexusTheme") || "dark"
    );

    // SIGNUP VALIDATION

    function registerUser(event) {

      event.preventDefault();

      const password =
        document.getElementById("signupPassword").value;

      const confirm =
        document.getElementById("confirmPassword").value;

      if (password !== confirm) {

        alert("Passwords do not match!");
        return;

      }

      alert(
        "Your signup interface is ready! " +
        "Real account registration will be connected using Firebase."
      );

    }

    // LOGIN DEMONSTRATION

    function loginUser(event) {

      event.preventDefault();

      alert(
        "Your login interface is ready! " +
        "Real login authentication will be connected using Firebase."
      );

    }

  </script>

</body>
</html>
